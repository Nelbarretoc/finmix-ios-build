# Compiles the FinMix iPhone wrapper on a free macOS runner (public
# repository). Published by scripts/publish-ios-shell.sh in the private FinMix
# repository; simulator and device archives are unsigned and submit nothing.
# Signing and TestFlight need an Apple Developer account.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # Apple requires Xcode 26+ for current iOS submissions; macos-15 still
    # defaults to Xcode 16.4 even though its simulator build can pass.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Show the Xcode version and project schemes
        run: xcodebuild -version && xcodebuild -list -project ios/App/App.xcodeproj
      - name: Compile for the iOS simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Compile a physical-device release archive (unsigned)
        run: |
          set -euo pipefail
          archive='build/FinMix.xcarchive'
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" CODE_SIGNING_ALLOWED=NO archive
          app="$archive/Products/Applications/App.app"
          test -d "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          test "$bundle_id" = 'com.th3rdgroup.finmix'
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist"
      - name: Launch the app in an iPhone simulator
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = (item for group in json.load(sys.stdin)["devices"].values() for item in group)
          print(next(item["udid"] for item in devices if item["name"].startswith("iPhone") and item["state"] == "Shutdown"))
          ')"
          app='build/ios/Build/Products/Release-iphonesimulator/App.app'
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" "$bundle_id"
          # Xcode 26 can finish the first simulator boot before WebKit paints.
          sleep 30
          xcrun simctl io "$device" screenshot FinMix-launch.png
          sips -g pixelWidth -g pixelHeight FinMix-launch.png
          swift - <<'SWIFT'
          import AppKit
          import Foundation

          guard let image = NSBitmapImageRep(data: try! Data(contentsOf: URL(fileURLWithPath: "FinMix-launch.png"))) else { exit(1) }
          var colored = 0
          for y in stride(from: image.pixelsHigh / 4, to: image.pixelsHigh * 3 / 4, by: 50) {
            for x in stride(from: image.pixelsWide / 4, to: image.pixelsWide * 3 / 4, by: 50) {
              guard let pixel = image.colorAt(x: x, y: y)?.usingColorSpace(.deviceRGB) else { continue }
              if pixel.redComponent < 0.96 || pixel.greenComponent < 0.96 || pixel.blueComponent < 0.96 { colored += 1 }
            }
          }
          guard colored >= 5 else { fputs("iPhone capture is blank\n", stderr); exit(1) }
          print("iPhone content samples: \(colored)")
          SWIFT
          xcrun simctl shutdown "$device"
      - name: Launch the app in an iPad simulator
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = (item for group in json.load(sys.stdin)["devices"].values() for item in group)
          print(next(item["udid"] for item in devices if item["name"].startswith("iPad") and item["state"] == "Shutdown"))
          ')"
          app='build/ios/Build/Products/Release-iphonesimulator/App.app'
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" "$bundle_id"
          # The first iPad boot can report ready while WebKit is still white.
          sleep 30
          xcrun simctl io "$device" screenshot FinMix-iPad-launch.png
          sips -g pixelWidth -g pixelHeight FinMix-iPad-launch.png
          swift - <<'SWIFT'
          import AppKit
          import Foundation

          guard let image = NSBitmapImageRep(data: try! Data(contentsOf: URL(fileURLWithPath: "FinMix-iPad-launch.png"))) else { exit(1) }
          var colored = 0
          for y in stride(from: image.pixelsHigh / 5, to: image.pixelsHigh * 4 / 5, by: 50) {
            for x in stride(from: image.pixelsWide / 5, to: image.pixelsWide * 4 / 5, by: 50) {
              guard let pixel = image.colorAt(x: x, y: y)?.usingColorSpace(.deviceRGB) else { continue }
              if pixel.redComponent < 0.96 || pixel.greenComponent < 0.96 || pixel.blueComponent < 0.96 { colored += 1 }
            }
          }
          guard colored >= 5 else { fputs("iPad capture is blank\n", stderr); exit(1) }
          print("iPad content samples: \(colored)")
          SWIFT
          xcrun simctl shutdown "$device"
      - name: Package the simulator app
        run: |
          cd build/ios/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/FinMix-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: FinMix-ios-simulator
          path: |
            FinMix-simulator.zip
            FinMix-launch.png
            FinMix-iPad-launch.png
          retention-days: 14
