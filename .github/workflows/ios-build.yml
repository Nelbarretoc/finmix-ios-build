# Compiles the FinMix iPhone wrapper on a free macOS runner (public
# repository). Published by scripts/publish-ios-shell.sh in the private FinMix
# repository; simulator and device archives are unsigned and submit nothing.
# Signing and TestFlight need an Apple Developer account.
name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    # Apple requires Xcode 26+ for current iOS submissions; macos-15 still
    # defaults to Xcode 16.4 even though its simulator build can pass.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Show the Xcode version and project schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj
          python3 .github/scripts/ios-app-store.py tools
      - name: Compile for the iOS simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Compile a physical-device release archive (unsigned)
        run: |
          set -euo pipefail
          archive='build/FinMix.xcarchive'
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" CODE_SIGNING_ALLOWED=NO archive
          app="$archive/Products/Applications/App.app"
          test -d "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          test "$bundle_id" = 'com.th3rdgroup.finmix'
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Info.plist"
          python3 .github/scripts/ios-store-capture.py verify-release --app "$app"
      - name: Compile debug-only native bridge checks
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/features CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO build
      - name: Test photo reading and file sharing on iPhone
        run: |
          python3 .github/scripts/ios-native-feature-smoke.py --family iphone \
            --app build/features/Build/Products/Debug-iphonesimulator/App.app \
            --output FinMix-native-features-iphone
      - name: Test photo reading and file sharing on iPad
        run: |
          python3 .github/scripts/ios-native-feature-smoke.py --family ipad \
            --app build/features/Build/Products/Debug-iphonesimulator/App.app \
            --output FinMix-native-features-ipad
      - name: Launch the app in an iPhone simulator
        run: |
          python3 .github/scripts/ios-simulator-smoke.py --family iphone \
            --app build/ios/Build/Products/Release-iphonesimulator/App.app \
            --output FinMix-launch.png
      - name: Launch the app in an iPad simulator
        run: |
          python3 .github/scripts/ios-simulator-smoke.py --family ipad \
            --app build/ios/Build/Products/Release-iphonesimulator/App.app \
            --output FinMix-iPad-launch.png
      - name: Package the simulator app
        run: |
          cd build/ios/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/FinMix-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: FinMix-ios-simulator
          path: |
            FinMix-simulator.zip
            FinMix-launch.png
            FinMix-iPad-launch.png
            FinMix-native-features-iphone/result.json
            FinMix-native-features-iphone/share-sheet.png
            FinMix-native-features-ipad/result.json
            FinMix-native-features-ipad/share-sheet.png
          retention-days: 14
